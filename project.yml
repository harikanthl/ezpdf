name: ezpdf
options:
  bundleIdPrefix: ai.harikanth
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  EzPDFCore:
    path: Packages/EzPDFCore
targets:
  ezpdf:
    type: application
    platform: macOS
    sources:
      - App
      - path: BrowserExtension/ezpdf-extension
        type: folder
        buildPhase: resources
    dependencies:
      - package: EzPDFCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: ezpdf
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: ezpdf uses Mail to send documents to your Kindle.
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: ai.harikanth.ezpdf
            CFBundleURLSchemes: [ezpdf]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        NSServices:
          - NSMenuItem: { default: "Make PDF with ezpdf" }
            NSMessage: convertService
            NSPortName: ezpdf
            NSSendTypes: [public.url, public.plain-text, NSStringPboardType]
    entitlements:
      path: App/Support/ezpdf.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.harikanth.ezpdf
        PRODUCT_NAME: ezpdf
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
schemes:
  ezpdf:
    build:
      targets:
        ezpdf: all
    test:
      targets: []
